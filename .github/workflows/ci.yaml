name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'frontend/**'
            backend:
              - 'backend/**'

      # ---------- Frontend ----------
      - uses: actions/setup-node@v6
        if: steps.filter.outputs.frontend == 'true'
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend install
        if: steps.filter.outputs.frontend == 'true'
        working-directory: frontend
        run: npm ci

      - name: Frontend lint
        if: steps.filter.outputs.frontend == 'true'
        working-directory: frontend
        run: npm run lint

      - name: Frontend build
        if: steps.filter.outputs.frontend == 'true'
        working-directory: frontend
        run: npm run build

      - name: Frontend test
        if: steps.filter.outputs.frontend == 'true'
        working-directory: frontend
        run: npm run test

      # ---------- Backend ----------
      - uses: actions/setup-node@v6
        if: steps.filter.outputs.backend == 'true'
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Backend install
        if: steps.filter.outputs.backend == 'true'
        working-directory: backend
        run: npm ci

      - name: Backend lint
        if: steps.filter.outputs.backend == 'true'
        working-directory: backend
        run: npm run lint

      - name: Backend test
        if: steps.filter.outputs.backend == 'true'
        working-directory: backend
        run: npm run test

      - name: Backend audit
        if: steps.filter.outputs.backend == 'true'
        working-directory: backend
        run: npm run audit