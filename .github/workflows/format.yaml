name: Auto-format

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v1
        id: app-token
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          token: ${{ steps.app-token.outputs.token }}

      - uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Install prettier
        run: npm install --no-save prettier

      - run: npx prettier --write .

      - name: Commit formatting fixes
        run: |
          git config user.name "portage-theater-formatter[bot]"
          git config user.email "portage-theater-formatter[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "chore: auto-format with prettier"
          git push
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}